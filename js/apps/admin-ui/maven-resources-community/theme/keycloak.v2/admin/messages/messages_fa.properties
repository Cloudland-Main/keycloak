allowUserinfoWithLightweightAccessTokenHelp=به نشانه های دسترسی سبک صادر شده توسط این سرویس گیرنده اجازه می دهد تا با نقطه پایانی UserInfo استفاده شوند. توکن های سبک وزن برای درون نگری توکن طراحی شده اند. این گزینه منسوخ شده است و در نسخه های بعدی حذف خواهد شد. فقط برای سازگاری به عقب در هنگام مهاجرت فعال شود.
ssf=SSF
ssfTransmitterEnabled=فرستنده SSF
ssfTransmitterEnabledHelp=اگر فعال باشد، این قلمرو به عنوان فرستنده چارچوب سیگنال‌های مشترک (SSF) عمل می‌کند و نقطه پایانی فراداده پیکربندی SSF را نشان می‌دهد. غیرفعال کردن یک قلمرو با جریان‌های فعال، رویدادهای در صف آن گیرنده‌ها را در حالت ذخیره حذف می‌کند. اگر می‌خواهید گیرنده‌ها قبل از خاموش شدن، از طریق یک SET به‌روزرسانی‌شده جریان مطلع شوند، ابتدا جریان‌ها را متوقف یا حذف کنید.
ssfTransmitterDisableConfirmTitle=فرستنده SSF را برای این حوزه غیرفعال کنید؟
ssfTransmitterDisableConfirmIntro=غیرفعال کردن ویژگی SSF Transmitter برای این حوزه اثرات زیر را دارد:
ssfTransmitterDisableConfirmBulletEndpoints=تمام نقاط پایانی فرستنده SSF (فراداده، جریان ها، موضوعات، وضعیت، SSE) 404 را به گیرنده ها برمی گرداند.
ssfTransmitterDisableConfirmBulletEvents=هیچ رویداد کاربر یا مدیر جدیدی برای گیرنده های SSF در این حوزه ثبت نخواهد شد.
ssfTransmitterDisableConfirmBulletDelivery=همه رویدادهای در صف برای گیرندگان در این حوزه (در انتظار و HELD) در ذخیره حذف خواهند شد. آنها را نمی توان بازیابی کرد.
ssfTransmitterDisableConfirmBulletReceivers=دریافت کنندگان از خاموش شدن جریان ها مطلع نمی شوند. آنها به سادگی از دیدن رویدادها دست می کشند.
ssfTransmitterDisableConfirmRecommendation=توصیه می‌شود: جریان‌های SSF فعال در این حوزه را قبل از ذخیره موقتاً متوقف یا حذف کنید تا گیرنده‌ها قبل از توقف تحویل، یک اعلان به‌روزرسانی جریانی مناسب دریافت کنند.
ssfTransmitterDisableConfirmContinue=فرستنده را غیرفعال کنید
ssfTransmitterDisableEventsCleared=رویدادهای SSF در صف برای این حوزه حذف شده است.
ssfTransmitterDisableEventsClearFailed=رویدادهای SSF در صف برای این حوزه حذف نشد
