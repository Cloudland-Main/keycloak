bindingRequired=صحافی رمزی مورد نیاز است
bindingRequiredHelp=اگر فعال باشد، این پیکربندی اعتبارنامه نیاز به صحافی دارنده رمزنگاری و مدارک مربوطه دارد. در صورت غیرفعال شدن، نیازی به اتصال رمزنگاری نیست و ابرداده های مرتبط حذف خواهند شد.
cryptographicBindingMethodsSupported=روش های اتصال رمزی
cryptographicBindingMethodsSupportedHelp=فهرستی جدا شده با کاما از نمایش مواد کلید رمزنگاری که اعتبارنامه به آن محدود می شود (به عنوان مثال: jwk برای JWT/SD-JWT VC یا cose_key برای ISO mDoc). در صورت خالی بودن، هیچ روش صحافی رمزنگاری تبلیغ نخواهد شد.
cryptographicBindingMethodsSupportedInvalid=روش(های) اتصال پشتیبانی نشده: {{invalid}}. مقادیر مجاز: {{allowed}}
bindingSupportedProofTypes=انواع اثبات پشتیبانی شده
bindingSupportedProofTypesHelp=فهرست جدا شده با کاما از انواع اثبات پذیرفته شده زمانی که صحافی رمزنگاری فعال باشد (به عنوان مثال: jwt). در صورت خالی بودن، هیچ نوع اثباتی تبلیغ نخواهد شد و اثباتی اجرا نخواهد شد.
bindingSupportedProofTypesInvalid=نوع(های) اثبات پشتیبانی نشده: {{invalid}}. مقادیر مجاز: jwt، گواهی
keyAttestationsRequired=گواهینامه های کلیدی مورد نیاز است
keyAttestationsRequiredHelp=در صورت فعال بودن، کیف پول باید یک گواهی کلیدی همراه با اثبات خود ارائه دهد. الزامات برای هر نوع اثبات پیکربندی شده تبلیغ می شود.
keyAttestationKeyStorage=سطوح مقاومت ذخیره سازی کلیدی
keyAttestationKeyStorageHelp=لیست اختیاری جدا شده با کاما از سطوح مقاومت ذخیره کلید پذیرفته شده، به عنوان مثال: iso_18045_moderate. هر دو فیلد سطح مقاومت را خالی بگذارید تا نیاز به تأیید کلید بدون محدودیت اضافی باشد.
keyAttestationUserAuthentication=سطوح مقاومت احراز هویت کاربر
keyAttestationUserAuthenticationHelp=لیست اختیاری جدا شده با کاما از سطوح مقاومت تأیید اعتبار کاربر پذیرفته شده، به عنوان مثال: iso_18045_moderate. مقادیر پسوند تعریف شده توسط یک اکوسیستم پشتیبانی می شوند.
supportedFormats=فرمت های پشتیبانی شده
supportedFormatsHelp=قالب اعتبار قابل تأیید. فرمت های پشتیبانی شده در حال حاضر: SD-JWT VC (dc+sd-jwt)، JWT VC (jwt_vc_json) و ISO mDoc (mso_mdoc) در صورت فعال بودن.
credentialRefreshInterval=فاصله بازخوانی اعتبارنامه
credentialRefreshIntervalHelp=هر چند وقت یکبار کیف پول باید اعتبارنامه را تجدید کند. VC واقعی که به کیف پول بازگردانده می شود، انقضای آن در این بازه تنظیم می شود. رمز تازه برای تمام طول عمر اعتبارنامه معتبر باقی می ماند و امکان تمدید منظم را فراهم می کند. اگر تنظیم نشود، به‌طور پیش‌فرض روی ۷ روز یا طول عمر اعتبارنامه، هرکدام که کوچک‌تر است، تنظیم می‌شود.
refreshIntervalCannotExceedLifetime=فاصله بازخوانی اعتبارنامه ({{interval}}) نمی تواند از طول عمر اعتبارنامه ({{lifetime}}) بیشتر شود. توکن به‌روزرسانی با طول عمر اعتبارنامه منقضی می‌شود.
credentialDisplay=نمایش اعتبار
credentialDisplayHelp=آرایه JSON از اشیاء حاوی ابرداده نمایش برای کیف پول (نام، نشان‌واره، رنگ‌ها و غیره). مثال: [{"name": "IdentityCredential"، "locale": "en-US"، "Logo": {"uri": "https://example.com/logo.png"، "alt_text": "Logo"}، "background_color": "#12107c"، "fftext_color": "#FF
credentialSigningAlgorithm=الگوریتم امضای اعتبارنامه
credentialSigningAlgorithmHelp=الگوریتم امضای مورد استفاده برای انتخاب کلید قلمرو فعال برای امضای اعتبارنامه ها (به عنوان مثال، "ES256"). اگر مشخص نشده باشد، کلید فعال با استفاده از الگوریتم پیش‌فرض قلمرو انتخاب می‌شود. اگر یک «شناسه کلید امضای» خاص انتخاب شده باشد، این گزینه غیرفعال می شود.
hashAlgorithm=الگوریتم هش
hashAlgorithmHelp=الگوریتم هش مورد استفاده برای اعتبارنامه های SD-JWT (به عنوان مثال "SHA-256"). اگر مشخص نشده باشد، پیش‌فرض «SHA-256» است.
supportedCredentialTypes=انواع اعتبار پشتیبانی شده
supportedCredentialTypesHelp=فهرستی از انواع اعتبارنامه جدا شده با کاما (به عنوان مثال، "VerifiableCredential,UniversityDegreeCredential"). در تعریف اعتبار برای فرمت‌های JWT VC و SD-JWT استفاده می‌شود. هنگامی که این گزینه پیکربندی نشده باشد، نام دامنه مشتری به عنوان ادعای "نوع" اعتبار مربوطه استفاده می شود.
verifiableCredentialType=نوع اعتبار قابل تأیید (VCT / DocType)
verifiableCredentialTypeHelp=شناسه نوع اعتبار برای اعتبارنامه های قالب SD-JWT و ISO mDoc. این مقدار در ادعای vct یک اعتبارنامه صادر شده SD-JWT و به عنوان نوع مدرک اعتبارنامه صادر شده ISO mDoc استفاده می شود. برای فرمت های SD-JWT و ISO mDoc مورد نیاز است.
tokenJwsType=نوع توکن JWS
tokenJwsTypeHelp=مقدار نوع نوشته شده در هدر تایپ JWT. اگر خالی باشد، یک پیش‌فرض فرمت خاص استفاده می‌شود ("dc+sd-jwt" برای SD-JWT VC و "vc+jwt" برای JWT VC). در صورت نیاز کیف پول یا سیستم، می توان آن را روی مقادیر سفارشی تنظیم کرد.
tokenJwsTypeFormatWarning=نوع توکن JWS پیکربندی شده با مقدار توصیه شده برای قالب اعتبار انتخاب شده مطابقت ندارد. مقدار توصیه شده: {{recommended}}.
visibleClaims=ادعاهای قابل مشاهده
visibleClaimsHelp=فهرست ادعاهای جدا شده با کاما که همیشه در متن SD-JWT افشا می‌شوند (به عنوان مثال، "id,iat,nbf,exp,jti,given_name"). پیش‌فرض «id,iat,nbf,exp,jti». فقط برای فرمت SD-JWT قابل استفاده است.
signingKeyId=امضای شناسه کلید
signingKeyIdHelp=اختیاری. شناسه کلید قلمرو مورد استفاده برای امضای اعتبار. اگر مشخص نشده باشد، کلید امضای فعال قلمرو الگوریتم مشخص شده توسط «الگوریتم امضای اعتبار» (در صورت تنظیم) به طور خودکار استفاده خواهد شد. اگر کلید خاصی در اینجا انتخاب شود، گزینه «الگوریتم امضای اعتبار» غیرفعال می شود و به طور خودکار روی الگوریتم کلید تنظیم می شود.
useDefaultKey=استفاده از پیش‌فرض (کلید امضای فعال قلمرو)
useDefaultAlg=از الگوریتم پیش فرض استفاده کنید
