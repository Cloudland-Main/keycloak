supportJwtClaimInIntrospectionResponse=از ادعای JWT در Introspection Response پشتیبانی کنید
supportJwtClaimInIntrospectionResponseHelp=اگر روشن باشد، درخواست‌های درون‌نگری که از هدر «Accept: application/jwt» استفاده می‌کنند نیز حاوی ادعایی به نام «jwt» هستند که ادعاهای نتیجه درون‌نگری به‌عنوان رمز دسترسی JWT کدگذاری می‌شود. این سوئیچ منسوخ شده است. لطفاً به جای این قابلیت از تبادل رمز استفاده کنید.
allowTokenIntrospectionWithoutAudienceCheck=اجازه درون نگری رمزی بدون بررسی مخاطب را بدهید
allowTokenIntrospectionWithoutAudienceCheckHelp=به این مشتری اجازه می‌دهد تا توکن‌ها را بدون اعتبارسنجی مخاطب بررسی کند. این گزینه منسوخ شده است و در نسخه های بعدی حذف خواهد شد. فقط برای سازگاری به عقب در هنگام مهاجرت فعال شود.
