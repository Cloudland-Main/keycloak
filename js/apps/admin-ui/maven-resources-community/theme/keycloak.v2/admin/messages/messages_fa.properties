realmOverridesDescription=لغو قلمرو به شما امکان می دهد ترجمه هایی را مشخص کنید که برای کل قلمرو اعمال شوند. این ترجمه ها هر ترجمه ای را که توسط یک موضوع مشخص شده است لغو می کند.
addTranslation=ترجمه اضافه کنید
effectiveMessageBundlesDescription=یک بسته پیام مؤثر مجموعه ای از ترجمه ها برای یک زبان، موضوع و نوع موضوع معین است. همچنین هرگونه نادیده گرفتن قلمرو را در نظر می گیرد، که اولویت دارد.
