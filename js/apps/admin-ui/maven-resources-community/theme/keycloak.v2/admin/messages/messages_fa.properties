ssfProfile.SSF_1_0=SSF 1.0
ssfProfile.SSE_CAEP=SSE CAEP 1.0
ssfCreateStreamProfileHelp=نمایه SSF برای رویدادهای ارسال شده از طریق این جریان اعمال می شود. نمایه یک تنظیم برای هر گیرنده است، بنابراین تغییر آن در اینجا ویژگی نمایه مشتریان گیرنده را قبل از ایجاد جریان نیز به روز می کند.
ssfUserSubjectFormat=فرمت موضوع
ssfUserSubjectFormatHelp=فرمت شناسه موضوعی که فرستنده برای بخش کاربری SSF Security Event Tokens استفاده می کند. به طور پیش‌فرض iss_sub (صادرکننده قلمرو + شناسه کاربر). ایمیل را انتخاب کنید تا آدرس ایمیل کاربر ارسال شود. انواع + مستاجر موضوع کاربر را در یک موضوع پیچیده می‌پیچد و یک خواهر یا برادر مستاجر با نام مستعار سازمانی IAM-Cloud کاربر اضافه می‌کند — زمانی که گیرنده انتظار مسیریابی چند مستاجر را دارد، از آن استفاده کنید. زمانی که قالب انتخابی قابل تولید نباشد، رویدادها حذف می شوند (با یک ورودی گزارش واضح) (به عنوان مثال ایمیل انتخاب شده اما کاربر ایمیل ندارد، یا + مستاجر انتخاب شده اما کاربر به هیچ سازمانی تعلق ندارد).
ssfUserSubjectFormat.iss_sub=iss_sub (صادر کننده و موضوع)
ssfUserSubjectFormat.email=ایمیل
ssfUserSubjectFormat.complex.iss_sub+tenant=مجتمع (iss_sub + سازمان مستاجر)
ssfUserSubjectFormat.complex.email+tenant=مجتمع (ایمیل + سازمان مستاجر)
ssfDefaultSubjects=موضوعات پیش فرض
ssfDefaultSubjectsHelp=کنترل می کند که فرستنده رویدادها را برای همه کاربران قلمرو (ALL) یا فقط برای کاربرانی که صریحاً از طریق نقطه پایانی افزودن موضوع یا برگه موضوعات (NONE) اضافه شده اند، ارائه می دهد. گیرنده‌ها می‌توانند این هر جریان را در زمان ایجاد لغو کنند.
ssfDefaultSubjects.ALL=ALL (ارائه رویدادها برای همه موضوعات)
ssfDefaultSubjects.NONE=هیچ (فقط برای موضوعات اضافه شده ارائه می شود)
ssfReceiverSubjectAddPolicy=خط مشی افزودن موضوع گیرنده
ssfReceiverSubjectAddPolicyHelp=کنترل می کند که گیرنده چه موضوعاتی را می تواند از طریق نقطه پایانی افزودن موضوع به جریان خود اضافه کند. AUTHENTICATED فقط به کاربرانی که یک جلسه فعال یا آفلاین یا رضایت اعطا شده برای این مشتری دارند اجازه می دهد. ANY به گیرنده اجازه می دهد هر کاربر یا سازمانی را در قلمرو اضافه کند. هیچ‌کدام همه افزوده‌های گیرنده محور را رد نمی‌کند. افزودن‌های ایجاد شده در برگه موضوعات توسط این خط‌مشی محدود نمی‌شوند و گیرنده هرگز نمی‌تواند موضوعی را که نادیده گرفته شده است را در آنجا اضافه کند.
ssfReceiverSubjectAddPolicy.NONE=هیچ (گیرنده نمی تواند موضوع اضافه کند)
ssfReceiverSubjectAddPolicy.AUTHENTICATED=تأیید شده (فقط کاربرانی که از طریق این سرویس گیرنده وارد شده اند)
ssfReceiverSubjectAddPolicy.ANY=ANY (هر کاربر یا سازمانی در قلمرو)
ssfAutoNotifyOnLogin=اضافه کردن موضوع در ورود
ssfAutoNotifyOnLoginHelp=وقتی فعال است و موضوعات پیش‌فرض روی هیچ‌کدام تنظیم می‌شود، کاربرانی که از طریق این کلاینت وارد می‌شوند، به‌طور خودکار به مجموعه موضوعاتی که گیرنده رویدادهایی درباره آن‌ها دریافت می‌کند اضافه می‌شوند - معادل کلیک روی افزودن برای آنها در برگه موضوعات. مفید برای سناریوهای فدرال که در آن فقط کاربرانی که از طریق این مشتری احراز هویت می‌کنند باید در تحویل رویداد گنجانده شوند.
ssfRequireServiceAccount=نیاز به حساب سرویس
ssfRequireServiceAccountHelp=وقتی فعال باشد، فقط حساب سرویس خود مشتری می تواند به API فرستنده SSF دسترسی داشته باشد. این رفتار پیش فرض زمانی است که به صراحت تنظیم نشده باشد. برای کلاینت هایی که از جریان کد مجوز استفاده می کنند، در جایی که یک کاربر واقعی احراز هویت می کند و پشتیبان گیرنده از توکن به دست آمده برای مدیریت جریان SSF خود استفاده می کند، غیرفعال شود.
ssfRequiredRole=نقش مورد نیاز
ssfRequiredRoleHelp=هنگام تنظیم، کاربر تأیید شده باید این نقش (نقش قلمرو یا نقش مشتری در این کلاینت) را برای دسترسی به API فرستنده SSF نگه دارد. علاوه بر الزامات حساب سرویس (در صورت فعال بودن) و الزامات محدوده بررسی شد. برای رد شدن از بررسی نقش، خالی بگذارید.
ssfAllowEmitEvents=انتشار رویدادها فعال شد
ssfAllowEmitEventsHelp=وقتی فعال باشد، یک حساب سرویس که نقش پیکربندی شده در زیر را در اختیار دارد، می‌تواند رویدادهای مصنوعی SSF را برای این گیرنده از طریق نقطه پایانی انتشار مدیریت ارسال کند. از این برای محیط‌هایی استفاده کنید که IAM-Cloud نمی‌تواند به‌طور بومی رویدادهای بالادستی را مشاهده کند (مثلاً تغییرات اعتباری که در LDAP اتفاق می‌افتد). اگر هیچ نقشی پیکربندی نشده باشد، نقطه پایانی رد می شود. تماس‌گیرندگانی که مجوز مدیریت این سرویس گیرنده را دارند، بررسی نقش را دور می‌زنند.
ssfEmitEventsRole=نقش رویدادهای مورد نیاز منتشر می شود
ssfEmitEventsRoleHelp=نقشی که حساب سرویس تماس گیرنده باید برای انجام رویدادهای مصنوعی داشته باشد. یک نقش قلمرو یا یک نقش مشتری در این گیرنده انتخاب کنید. فقط زمانی اعمال می شود که "رویدادهای مصنوعی" فعال باشد.
ssfMinVerificationInterval=حداقل فاصله تأیید
ssfMinVerificationIntervalHelp=حداقل زمان بر حسب ثانیه که باید بین درخواست‌های تأیید تأیید شده توسط گیرنده برای جریان این مشتری بگذرد. درخواست‌های بعدی در این پنجره با HTTP 429 رد می‌شوند. برای استفاده از پیش‌فرض در سراسر فرستنده، خالی بگذارید.
ssfMaxEventAge=حداکثر سن رویداد
ssfMaxEventAgeHelp=حداکثر سن (بر حسب ثانیه) رویدادهای درانتظار، نگه‌داشته‌شده یا صندوق ارسال نامه مرده برای این گیرنده. قبل از اعمال پنجره جهانی حفظ حروف مرده، ردیف‌های قدیمی‌تر با مجوز خانه‌داری فرستنده پاک می‌شوند. از یک مقدار کوتاه برای گیرنده هایی استفاده کنید که رویدادهای آنها به سرعت ارتباط خود را از دست می دهند (مثلاً پس از جلسه). را به ارث بگذارید تا فقط به حفظ در سراسر فرستنده بازگردد.
ssfInactivityTimeout=زمان عدم فعالیت
ssfInactivityTimeoutHelp=SSF 1.0 inactivity_timeout — اگر هیچ فعالیت گیرنده واجد شرایط (هر ضربه ای در API مدیریت جریان، یا نظرسنجی برای جریان های POLL) در این پنجره وارد نشود، فرستنده به طور خودکار جریان را متوقف می کند و یک رویداد به روز شده جریان را ارسال می کند. فعالیت با جزئیات 5 دقیقه‌ای ردیابی می‌شود (برای جلوگیری از ضربه زدن به فروشگاه مشتری در نظرسنجی‌های شلوغ) ردیابی می‌شود، بنابراین بررسی مؤثر ممکن است تا 5 دقیقه دیر انجام شود - زمان‌بندی‌ها به راحتی بزرگ‌تر از آن انتخاب کنید. بدون تایم اوت خالی بگذارید.
ssfSubjectRemovalGrace=فضل حذف موضوع
ssfSubjectRemovalGraceHelp=دفاع SSF 1.0 «حذف موضوع مخرب». پس از یک گیرنده / جریان / موضوع / حذف، فرستنده به ارائه رویدادها برای سوژه برای این چند ثانیه ادامه می دهد، و در برابر توکن حامل گیرنده به خطر افتاده که به طور بی صدا رویدادها را برای یک هدف خاموش می کند، دفاع می کند. حذف‌های مبتنی بر مدیریت همیشه بلافاصله اعمال می‌شوند. برای به ارث بردن پیش‌فرض SPI موضوعی-removal-grace-seconds در سطح فرستنده، خالی بگذارید. روی 0 تنظیم کنید تا این گیرنده را از پنجره grace خارج کنید حتی زمانی که پیش‌فرض فرستنده مثبت است (مثلاً برای گیرنده‌هایی که وقتی کاربران از سرویس خود خارج می‌شوند، به طور قانونی سوژه‌ها را حذف می‌کنند).
ssfAutoVerifyStream=تأیید خودکار جریان
ssfAutoVerifyStreamHelp=هنگامی که فعال باشد، فرستنده به طور خودکار یک مجموعه تأیید جریان را بلافاصله پس از ایجاد یک جریان توسط گیرنده ارسال می کند. در صورت غیرفعال شدن، گیرنده می‌تواند با ارسال یک درخواست صریح تأیید صریح به نقطه پایانی تأیید، تأیید را انجام دهد.
ssfVerificationDelay=تأخیر تأیید
ssfVerificationDelayHelp=تاخیر در میلی ثانیه قبل از ارسال رویداد تأیید توسط فرستنده پس از ایجاد جریان. فقط زمانی اعمال می‌شود که تأیید خودکار جریان فعال باشد.
ssfStreamStatus=وضعیت
ssfStreamStatusHelp=وضعیت فعلی جریان SSF برای این مشتری. از دکمه‌های عمل زیر برای تغییر آن استفاده کنید - این دکمه‌ها از مسیر انتقال اجباری SSF عبور می‌کنند، که یک SET به‌روزرسانی جریانی را به گیرنده ارسال می‌کند و بک لاگ خروجی را با وضعیت جدید تراز می‌کند.
ssfStreamStatus.enabled=فعال شد
ssfStreamStatus.paused=مکث کرد
ssfStreamStatus.disabled=از کار افتاده است
ssfStreamStatusEnable=جریان را فعال کنید
ssfStreamStatusPause=توقف جریان
ssfStreamStatusDisable=غیرفعال کردن جریان
ssfStreamStatusUpdateSuccess=وضعیت جریان به روز شد. یک رویداد به روز شده در جریان به گیرنده ارسال شده است.
ssfStreamStatusUpdateError=وضعیت پخش به‌روزرسانی نشد\: {{error}}
ssfStreamStatusLabel=وضعیت جریان
ssfStreamIndicator.enabled=فعال شد
ssfStreamIndicator.paused=مکث کرد
