authenticatorRefConfig.value.help=یک نام مرجع سفارشی برای احراز هویت اضافه کنید. هنگامی که این احراز هویت در طول یک جریان احراز هویت با موفقیت تکمیل شد، نقشه‌بردار پروتکل مرجع روش احراز هویت (AMR) از این مقدار برای پر کردن ادعای amr توکن‌های تولید شده استفاده می‌کند. توجه داشته باشید، پروتکل AMR باید برای مشتری معین پیکربندی شود تا ادعای AMR را پر کند.
authenticatorRefConfig.value.label=مرجع احراز هویت
authenticatorRefConfig.maxAge.help=حداکثر سن در ثانیه که مقدار مرجع احراز هویت در یک جلسه SSO مناسب است. هنگامی که از نقشه‌بردار پروتکل مرجع روش احراز هویت (AMR) استفاده می‌شود، AMR تنها در صورتی معتبر در نظر گرفته می‌شود که اجرای احراز هویت در حداکثر سن مشخص شده تکمیل شده باشد.
authenticatorRefConfig.maxAge.label=حداکثر سن مرجع احراز هویت
loa-condition-level=سطح احراز هویت (LoA)
loa-condition-level.tooltip=سطح احراز هویت این مقدار باید همیشه عدد صحیح باشد که بزرگتر یا مساوی 0 است. جریانهای فرعی در جریان احراز هویت باید همیشه از سطوح پایین به سطوح بالاتر مرتب شوند.
loa-max-age=حداکثر سن
loa-max-age.tooltip=حداکثر سن در ثانیه برای معتبر بودن این سطح از احراز هویت. اگر سطح خاصی درخواست شده باشد و کاربر قبلاً با این سطح زودتر از مدت زمان مشخص شده چند ثانیه پیش احراز هویت شده باشد، از او درخواست احراز هویت مجدد نخواهد شد. اما اگر او دیرتر از مقدار مشخص شده چند ثانیه پیش احراز هویت کرد، باید دوباره با این سطح احراز هویت کند. مقدار 0 در پیکربندی به این معنی است که کاربر همیشه باید هر زمان که این سطح درخواست می‌شود مجدداً با این سطح احراز هویت کند.
