periodicFullSyncHelp=اگر «وارد کردن کاربران» فعال باشد، یک کار دوره ای برای همگام سازی کاربران از LDAP به IAM-Cloud شروع می شود. این نوع همگام سازی در هر بار اجرا، وارد کردن کاربران جدید یا به روز رسانی کاربران موجود، همه کاربران را از LDAP واکشی می کند. اگر تعداد زیادی کاربر در LDAP دارید، این ممکن است ناکارآمد باشد. در این صورت، می‌توانید این گزینه را غیرفعال کنید و به جای آن از «همگام‌سازی کاربران تغییر یافته دوره‌ای» استفاده کنید.
periodicChangedUsersSyncHelp=اگر «وارد کردن کاربران» فعال باشد، یک کار دوره‌ای برای همگام‌سازی کاربران از LDAP به IAM-Cloud بر اساس مُهرهای زمانی ایجاد شده یا آخرین به‌روزرسانی‌شده‌شان شروع می‌شود. این نوع همگام سازی کارآمدتر از همگام سازی کامل است، به خصوص اگر تعداد کاربران زیادی در LDAP داشته باشید. با این حال، مستلزم آن است که سرور LDAP شما از جستجو با استفاده از ویژگی‌های «createTimestamp» و «modifyTimestamp» در گزاره‌های پرس و جو پشتیبانی کند.
signatureAlgorithmHelp=الگوریتم امضا که برای امضای اسناد استفاده می شود. توجه داشته باشید که الگوریتم‌های مبتنی بر «SHA1» منسوخ شده‌اند و می‌توانند در آینده حذف شوند. توصیه می شود به جای «*_SHA1» از الگوریتم ایمن تر استفاده کنید.
allow-default-scopes.tooltip=در صورت روشن بودن، به مشتریانی که به تازگی ثبت نام کرده اند، اجازه داده می شود که محدوده های کلاینت را در حوزه های کلاینت پیش فرض حوزه یا حوزه های کلاینت اختیاری قلمرو ذکر شده داشته باشند.
emailVerified=ایمیل تایید شد
addExecutionHelp=اجرا می تواند طیف وسیعی از اقدامات، از ارسال ایمیل بازنشانی گرفته تا اعتبارسنجی OTP را داشته باشد.
requestObjectRequiredHelp=مشخص می‌کند که آیا مشتری نیاز به ارائه یک شی درخواست با درخواست‌های مجوز خود دارد، و از چه روشی می‌تواند برای این کار استفاده کند. اگر روی "نیازی نیست" تنظیم شود، ارائه یک شی درخواست اختیاری است. در سایر موارد، ارائه یک شی درخواست الزامی است. اگر روی "درخواست" تنظیم شود، شی درخواست باید با مقدار ارائه شود. اگر روی "request_uri" تنظیم شود، شی درخواست باید با مرجع ارائه شود. اگر روی "request or request_uri" تنظیم شود، می توان از هر یک از روش ها استفاده کرد.
clientScopesRolesScope=اگر نگاشت محدوده نقشی تعریف نشده باشد، هر کاربر مجاز است از این محدوده مشتری استفاده کند. اگر نگاشت محدوده نقش تعریف شده باشد، کاربر باید عضو حداقل یکی از نقش ها باشد.
