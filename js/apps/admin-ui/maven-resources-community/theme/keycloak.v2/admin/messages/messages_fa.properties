organizationRedirectUrlHelp=پس از تکمیل ثبت نام یا پذیرش دعوت نامه به سازمان، کاربر را به طور خودکار هدایت کنید. اگر خالی بماند، کاربر به طور پیش فرض به کنسول حساب هدایت می شود.
