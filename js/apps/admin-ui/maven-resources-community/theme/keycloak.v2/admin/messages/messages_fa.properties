caseSensitiveOriginalUsername=نام کاربری حساس به حروف کوچک و بزرگ
caseSensitiveOriginalUsernameHelp=اگر فعال باشد، نام کاربری اصلی از ارائه‌دهنده هویت همانطور که در هنگام فدرال کردن کاربران حفظ می‌شود. در غیر این صورت، نام کاربری ارائه‌دهنده هویت با حروف کوچک است و اگر به حروف بزرگ و کوچک حساس باشد، ممکن است با مقدار اصلی مطابقت نداشته باشد. این تنظیم فقط بر نام کاربری مرتبط با هویت فدرال تأثیر می گذارد زیرا نام های کاربری در سرور همیشه با حروف کوچک هستند.
allowAdminRoleMapping=اجازه دادن نقش‌های سرپرست از طریق نقشه‌برداران
allowAdminRoleMappingHelp=اگر فعال باشد، کاربرانی که مجوز مدیریت هویت ارائه‌دهنده‌ها را دارند، می‌توانند نگاشت دهنده‌های ارائه‌دهنده هویت ایجاد کنند که نقش‌های سرپرست را اعطا می‌کنند (مثلاً قلمرو-مدیر، مدیریت-کاربران). به طور پیش فرض غیرفعال است.
supportsClientAssertions=از اظهارات مشتری پشتیبانی می کند
supportsClientAssertionsHelp=این تنظیم پشتیبانی برای استفاده از اظهارات مشتری صادر شده توسط ارائه دهنده برای احراز هویت مشتریان را فعال می کند. این نیاز به تنظیم صادرکننده و کلیدهای این ارائه‌دهنده هویت دارد. کلیدها را می‌توان با راه‌اندازی گزینه‌های «JWKS URL» یا «Validating public key» در بالا تنظیم کرد، که وقتی این گزینه فعال است نشان داده می‌شود.
supportsClientAssertionReuse=اجازه استفاده مجدد از اظهارات مشتری را می دهد
supportsClientAssertionReuseHelp=به طور پیش فرض، یک ادعای مشتری نمی تواند چندین بار استفاده شود. اگر مشتری قادر به بازیابی یک ادعای مشتری جدید برای هر درخواست نباشد، این گزینه را می توان فعال کرد تا امکان استفاده مجدد از همان ادعای مشتری را فراهم کند.
allowClientIdAsAudience=به شناسه مشتری به عنوان مخاطب برای ادعاها اجازه می دهد
allowClientIdAsAudienceHelp=اگر فعال باشد، شناسه مشتری پیکربندی شده در Identity Provider تنها مخاطب معتبر برای اظهارات مورد استفاده در تأیید اعتبار مشتری فدرال و در اعطای مجوز JWT (اعلامات مشتری و مجوز JWT) است. شناسه مشتری به جای token-url/ssuer-url تعریف شده در مشخصات مربوطه استفاده می شود. توجه داشته باشید که این رفتار تحت هیچ استانداردی قرار نمی گیرد.
