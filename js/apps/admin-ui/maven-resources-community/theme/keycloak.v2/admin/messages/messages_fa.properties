sendCredentialOfferLifespanHelp=طول عمر پیوند ایمیل پیشنهاد اعتبارنامه برای چه مدتی معتبر است. اگر کاربر در این بازه زمانی لینک پیشنهاد اعتبار را از ایمیل خود دریافت نکند، لینک پیشنهاد اعتبار نامعتبر خواهد بود. در این صورت، باید ایمیل جدیدی ارسال شود یا کاربر باید خودش پیشنهاد اعتبار قابل تأیید را دریافت کند - به عنوان مثال از کنسول حساب.
