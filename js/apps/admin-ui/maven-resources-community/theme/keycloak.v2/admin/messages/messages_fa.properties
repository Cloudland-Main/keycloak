ssfStreamIndicator.registered=ثبت شده است
ssfStreamIndicator.unregistered=ثبت نشده است
ssfStreamStatusReason=دلیل وضعیت
ssfStreamStatusReasonHelp=دلیل قابل خواندن توسط انسان مرتبط با وضعیت جاری جریان، اگر یکی از آخرین تغییرات وضعیت ارائه شده باشد (مثلاً با توقف یا غیرفعال کردن جریان توسط گیرنده).
ssfDelivery=روش تحویل
ssfDeliveryHelp=روش تحویلی که فرستنده برای رویدادهای این جریان استفاده می کند. فشار (RFC 8935) SET های امضا شده را به نقطه پایانی گیرنده ارسال می کند. نظرسنجی (RFC 8936) رویدادها را در صندوق خروجی فرستنده نگه می دارد تا زمانی که گیرنده آنها را از طریق نقطه پایانی نظرسنجی میزبانی شده توسط فرستنده بکشد.
ssfDelivery.PUSH=فشار دهید
ssfDelivery.POLL=نظرسنجی
ssfDelivery.PULL=بکشید
ssfPushEndpointConnectTimeout=Push Connect Timeout
ssfPushEndpointConnectTimeoutHelp=هنگام ارائه رویدادهای SSF از طریق فشار HTTP به نقطه پایانی فشار گیرنده، تایم اوت را در میلی ثانیه وصل کنید.
ssfPushEndpointSocketTimeout=مهلت زمانی سوکت فشاری
ssfPushEndpointSocketTimeoutHelp=هنگام ارائه رویدادهای SSF از طریق فشار HTTP به نقطه پایانی فشار گیرنده، زمان پایان سوکت (خواندن) در میلی ثانیه.
