ssfLookupTitle=رویداد را جستجو کنید
ssfLookupTitleHelp=وضعیت تحویل یک نشانه رویداد امنیتی خاص را توسط jti آن بررسی کنید. محدوده به این گیرنده.
ssfEmitTitle=رویداد مصنوعی را منتشر کنید
ssfEmitTitleHelp=یک رویداد مصنوعی را به این گیرنده فشار دهید. فرستنده sub_id را بر اساس فرمت موضوع کاربر پیکربندی شده گیرنده قالب بندی می کند و فیلترهای اشتراک مشابه رویدادهای بومی را اعمال می کند.
ssfEmitEventType=نوع رویداد
ssfEmitEventTypeHelp=یکی از انواع رویدادهایی که فرستنده این گیرنده می تواند منتشر کند. محموله زیر در برابر کلاس رویداد ثبت شده برای نوع انتخابی از حالت سریال خارج می شود.
ssfEmitEventTypeSelectPrompt=- یک نوع رویداد را انتخاب کنید -
ssfEmitEventTypeRequired=یک نوع رویداد را برای انتشار انتخاب کنید.
ssfEmitSubjectValueHelp=به یک کاربر IAM-Cloud (شناسه کاربر / کاربر ایمیل / نام کاربری کاربر) یا سازمان (org-alias) حل می شود. برای سوژه های کاربر، فرستنده sub_id را با استفاده از فرمت موضوع کاربر پیکربندی شده گیرنده می سازد، بنابراین SET منتشر شده با شکل یک رویداد بومی برای این گیرنده مطابقت دارد. موضوعات org یک موضوع پیچیده فقط مستاجر منتشر می کنند. فیلترهای اشتراک موضوع و قوانین ناموفق فرمت خاص (بدون ایمیل، بدون سازمان برای مستاجر +) همچنان اعمال می‌شوند.
ssfEmitSubjectValueRequired=مقدار موضوع مورد نیاز است.
ssfEmitPayload=بار رویداد (JSON)
ssfEmitPayloadHelp=بدنه ویژه رویداد - باید در برابر کلاس نوع رویداد انتخابی، از حالت سریال خارج شود. برای انتشار یک بار خالی خالی بگذارید (فقط برای انواع رویداد بدون فیلدهای الزامی معنادار است). متغیرهای پشتیبانی شده (قبل از تجزیه JSON گسترش یافته است): __now__ به زمان فعلی یونیکس در چند ثانیه حل می شود. قابل استفاده بدون نقل قول برای فیلدهای عددی، به عنوان مثال. "event_timestamp": __now__.
ssfEmitPayloadInvalidJson=Payload JSON معتبر نیست: {{error}}
ssfEmitEvent=رویداد را منتشر کنید
ssfEmitResult=منتشر شده — status={{status}}، jti={{jti}}
ssfEmitResultLookupLink=این رویداد را در جستجوی رویداد جستجو کنید
ssfEmitErrorSubjectNotFound=موضوع یافت نشد: {{type}} = {{value}}
ssfEmitErrorUserSubjectMemberNotFound=موضوع یافت نشد: عضو کاربر موضوع پیچیده قابل حل نیست.
ssfEmitErrorTenantSubjectMemberNotFound=موضوع یافت نشد: عضو مستاجر موضوع پیچیده را نمی توان به سازمانی حل و فصل کرد.
ssfEmitErrorSubjectMismatch=عدم تطابق موضوع: موضوع کاربر عضو سازمان مستاجر نیست.
ssfEmitErrorInvalidRequest=درخواست نامعتبر: {{detail}}
ssfEmitErrorNoDeliveryConfig=جریان هیچ روش تحویل پیکربندی نشده است، بنابراین رویداد قابل تحویل نیست. ابتدا تحویل فشار یا نظرسنجی را برای جریان پیکربندی کنید.
ssfEmitErrorUnknown=انتشار ناموفق بود: {{detail}}
ssfReceiverHelp=وقتی IAM-Cloud نشانه‌های رویداد امنیتی را به این گیرنده ارائه می‌کند، خط‌مشی سمت فرستنده اعمال می‌شود.
ssfSectionGeneral=ژنرال
ssfSectionGeneralHelp=هویت، نمایش، و رفتار جریانی برای این گیرنده SSF: نمایه و توضیحات، مخاطبان مورد نظر، سوژه‌ها برای آنها ارائه می‌شوند، قالب شناسه موضوع، خط‌مشی تأیید، و پنجره لطف اعمال می‌شود که گیرندگان سوژه‌ها را حذف می‌کنند. هر زمان که جریانی برای این مشتری ثبت یا به‌روزرسانی شود، اعمال می‌شود.
ssfSectionAuthentication=احراز هویت
ssfSectionAuthenticationHelp=به قوانینی دسترسی پیدا کنید که چه کسی می تواند جریان SSF این گیرنده را مدیریت کند و نقطه پایانی انتشار رویداد مصنوعی را فراخوانی کند.
ssfSectionDelivery=تحویل
ssfSectionDeliveryHelp=این گیرنده از کدام روش‌های تحویل استفاده می‌کند و وقتی تحویل فشار مجاز است، پیشوندهای URL فرستنده مجاز است که نشانه‌های رویداد امنیتی را به آن فشار دهد.
ssfSectionEvents=رویدادها
ssfSectionEventsHelp=نوع رویدادی که این گیرنده تبلیغ می‌کند و ارائه می‌کند، محدودیت‌های سنی و عدم فعالیت که صندوق خروجی را محدود می‌کند، و اینکه آیا مدیران ممکن است رویدادهای مصنوعی را برای اشکال‌زدایی یا یکپارچه‌سازی گردش کار منتشر کنند.
ssfAllowedDeliveryMethods=روش های تحویل مجاز
ssfAllowedDeliveryMethodsHelp=این گیرنده هنگام ثبت جریان، چه روش های تحویل را می تواند انتخاب کند. حداقل یک روش باید فعال باشد. گیرنده یکی از روش های مجاز را در زمان ایجاد جریان انتخاب می کند. محدود کردن این لیست به فقط نظرسنجی، فرستنده را از برقراری تماس های HTTP خروجی با این گیرنده منع می کند.
ssfAllowedDeliveryMethods.push=تحویل فشاری
ssfAllowedDeliveryMethods.pushHelp=فرستنده توکن های رویداد امنیتی را به یک URL ارائه شده توسط گیرنده (RFC 8935) ارسال می کند. نیاز به URL های فشار معتبر برای پیکربندی در زیر دارد.
ssfAllowedDeliveryMethods.poll=تحویل نظرسنجی
ssfAllowedDeliveryMethods.pollHelp=گیرنده نشانه‌های رویداد امنیتی در صف را از نقطه پایانی نظرسنجی متعلق به فرستنده (RFC 8936) می‌کشد. URL نقطه پایانی توسط IAM-Cloud تولید می شود. هیچ لیست مجاز هر گیرنده مورد نیاز نیست.
ssfValidPushUrls=URL های فشار معتبر
ssfValidPushUrlsHelp=لیست مجاز از الگوهای URL که گیرنده ممکن است به عنوان نقطه پایانی فشار خود ثبت کند. هر ورودی با نشانی اینترنتی ارائه شده توسط گیرنده با استفاده از پسوند منطبق دقیق یا پسوند* تطبیق داده می شود (به عنوان مثال https://receiver/push/* به هر مستاجر + شناسه جریانی در آن مسیر اجازه می دهد). URL خارج از لیست مجاز با HTTP 400 رد می شود - این دفاع SSRF گیرنده است. برهنه * مورد احترام نیست.
ssfValidPushUrls.add=URL فشار معتبر اضافه کنید
ssfReceiverEnabled=گیرنده SSF
ssfReceiverEnabledHelp=اگر فعال باشد، این سرویس گیرنده به عنوان گیرنده چارچوب سیگنال های مشترک (SSF) عمل می کند. IAM-Cloud رویدادهای امنیتی را طبق جریان SSF پیکربندی شده به این کلاینت منتقل می کند.
ssfStream=جریان SSF
ssfStreamHelp=جریان برای این گیرنده و تنظیمات تحویل رویداد آن ثبت شده است.
ssfStreamNotRegistered=هنوز هیچ جریان SSF ثبت نشده است
ssfStreamNotRegisteredHelp=این مشتری گیرنده هنوز یک جریان SSF را با فرستنده ثبت نکرده است. شما می توانید یکی از طرف خود را در زیر ایجاد کنید، یا گیرنده می تواند خودش از طریق SSF Transmitter API ایجاد کند.
ssfCreateStream=ایجاد جریان
ssfCreateStreamReset=پاک کردن
ssfCreateStreamSuccess=جریان SSF با موفقیت ایجاد شد.
ssfCreateStreamError=جریان SSF ایجاد نشد\: {{error}}
ssfCreateStreamDeliveryMethod=روش تحویل
ssfCreateStreamDeliveryMethodHelp=روش تحویل SSF برای استفاده برای این جریان. فشار (RFC 8935) SET های امضا شده را به نقطه پایانی میزبان گیرنده می فرستد. Poll (RFC 8936) نقطه پایانی فرستنده را میزبانی می کند و گیرنده SET ها را طبق برنامه زمانی خود می کشد. فشار به گیرنده نیاز دارد تا URL نقطه پایانی خود را ارائه دهد. نظرسنجی از یک URL تولید شده توسط فرستنده استفاده می کند که در پاسخ ایجاد برگردانده شده است.
ssfCreateStreamEndpointUrl=نشانی وب نقطه پایانی را فشار دهید
ssfCreateStreamEndpointUrlHelp=نشانی وب HTTPS در سمت گیرنده که فرستنده توکن‌های رویداد امنیتی را در آن پست می‌کند.
ssfCreateStreamEndpointUrlRequired=URL نقطه پایانی فشار لازم است.
ssfCreateStreamEndpointUrlInvalid=نشانی وب Push Endpoint باید یک URL مطلق http یا https باشد.
ssfCreateStreamEventsRequested=رویدادهای درخواست شده
ssfCreateStreamEventsRequestedHelp=انواع رویداد SSF که گیرنده باید مشترک آنها باشد. از رویدادهایی که فرستنده برای انتشار پیکربندی شده است انتخاب کنید. برای استفاده از مجموعه پشتیبانی شده پیش فرض فرستنده، خالی بگذارید.
ssfCreateStreamDescription=توضیحات
ssfCreateStreamDescriptionHelp=برچسب اختیاری قابل خواندن توسط انسان برای جریان، در این رابط کاربری سرپرست برای اپراتورها ظاهر شد.
ssfStreamAudienceCurrentHelp=مخاطب در حال حاضر در جریان SSF ثبت شده پیکربندی شده است. به روز رسانی قسمت Stream Audience در بخش SSF Receiver فقط بر جریان هایی تأثیر می گذارد که گیرنده پس از تغییر ثبت می کند.
ssfStreamPushEndpointUrl=نشانی وب نقطه پایانی را فشار دهید
ssfStreamPushEndpointUrlHelp=URL HTTPS در سمت گیرنده که فرستنده توکن های رویداد امنیتی را به آن ارسال می کند. فقط برای جریان‌هایی که از روش تحویل فشار HTTP استفاده می‌کنند نشان داده می‌شود.
ssfStreamPollEndpointUrl=نشانی وب نقطه پایان نظرسنجی
ssfStreamPollEndpointUrlHelp=URL میزبان فرستنده که گیرنده به منظور کشیدن نشانه های رویداد امنیتی معلق (RFC 8936) به آن پست می کند. گیرنده با توکن حامل خود احراز هویت می کند. هیچ عنوان مجوز سمت فرستنده پیکربندی نشده است.
ssfStreamPushAuthHeader=هدر Push Authorization
ssfStreamPushAuthHeaderHelp=مقدار ارسال شده در هدر درخواست مجوز در هر فشار (مثلاً یک توکن حامل) همانطور که هست.
ssfDeleteStream=حذف جریان
ssfDeleteStreamConfirmTitle=جریان SSF حذف شود؟
ssfDeleteStreamConfirmMessage=جریان SSF ثبت شده برای این کلاینت حذف خواهد شد و گیرنده باید آن را دوباره ایجاد کند. این قابل واگرد نیست. ادامه دهید؟
ssfDeleteStreamSuccess=جریان SSF با موفقیت حذف شد.
ssfSubjects=موضوعات SSF
ssfSubjectsHelp=مدیریت کنید که این گیرنده از چه کاربران یا سازمان‌هایی رویدادها را دریافت می‌کند. از بررسی استفاده کنید تا ببینید آیا موضوعی در حال حاضر گنجانده شده است یا خیر.
ssfSubjectType=نوع موضوع
ssfSubjectTypeHelp=هنگام جستجوی موضوع چگونه مقدار زیر تفسیر می شود. گزینه های کاربر از طریق ایمیل، شناسه یا نام کاربری به کاربر IAM-Cloud حل می شود. سازمان (با نام مستعار) به یک سازمان IAM-Cloud حل و فصل می شود. اولویت اعلان به عنوان ویژگی ssf.notify.${clientId} در موجودیت حل شده ذخیره می شود.
ssfSubjectType.userEmail=کاربر (از طریق ایمیل)
ssfSubjectType.userId=کاربر (بر اساس شناسه)
ssfSubjectType.userUsername=کاربر (بر اساس نام کاربری)
