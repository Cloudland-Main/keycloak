hideOnLoginWhenOrgNotResolved=وقتی سازمان حل نشد در صفحه ورود پنهان شود
hideOnLoginWhenOrgNotResolvedHelp=در صورت فعال بودن، زمانی که سازمان بر اساس دامنه ایمیل کاربر قابل حل نباشد، ارائه‌دهنده هویت در صفحه ورود پنهان می‌شود. در غیر این صورت، ارائه دهنده هویت بدون در نظر گرفتن اینکه سازمان حل شده است یا خیر، در صفحه ورود نشان داده می شود. اگر "پنهان کردن در صفحه ورود" نیز فعال باشد، ارائه دهنده هویت همیشه در صفحه ورود پنهان خواهد بود.
showOnLoginForUnlinkedMembers=نمایش در صفحه ورود برای اعضای بدون پیوند
showOnLoginForUnlinkedMembersHelp=اگر فعال باشد، این ارائه‌دهنده هویت به اعضای سازمان نشان داده می‌شود، حتی زمانی که آنها قبلاً به ارائه‌دهنده هویت دیگری مرتبط شده باشند.
