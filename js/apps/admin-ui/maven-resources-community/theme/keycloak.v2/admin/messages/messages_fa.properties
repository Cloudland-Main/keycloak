ssfSubjectValueRequired=لطفاً مقدار موضوع را وارد کنید.
ssfSubjectNotFound=موضوع پیدا نشد مقدار و نوع موضوع را بررسی کنید.
ssfSubjectIsNotified=رویدادهای مربوط به این موضوع به این جریان تحویل داده می شود.
ssfSubjectIsNotifiedViaOrg=موضوع از طریق عضویت در سازمان برای این جریان گنجانده شده است.
ssfSubjectIsNotifiedViaOrgNamed=موضوع از طریق عضویت در سازمان "{{org}}" برای این جریان گنجانده شده است.
ssfSubjectIsImplicitlyIncluded=موضوع به طور ضمنی در تحویل رویداد برای این جریان گنجانده شده است (default_subjects=ALL و بدون استثناء صریح).
ssfSubjectIsNotNotified=موضوع در تحویل رویداد برای این جریان گنجانده نشده است.
ssfSubjectAdded=موضوع به این جریان اضافه شده است.
ssfSubjectIgnore=موضوع را نادیده بگیرید
ssfSubjectIgnored=موضوع برای این جریان نادیده گرفته شده است.
ssfSubjectIsIgnored=موضوع به صراحت از تحویل رویداد برای این جریان مستثنی شده است.
ssfSubjectIsIgnoredViaOrg=موضوع از طریق عضویت در سازمان برای این جریان حذف می شود.
ssfSubjectIsIgnoredViaOrgNamed=موضوع از طریق عضویت در سازمان "{{org}}" برای این جریان حذف می شود.
ssfSubjectRemoved=موضوع از این جریان حذف شده است.
