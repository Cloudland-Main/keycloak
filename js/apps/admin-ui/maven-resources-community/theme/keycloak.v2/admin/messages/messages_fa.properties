membershipUserLdapAttributeHelp=فقط در صورتی استفاده می شود که نوع ویژگی عضویت UID باشد. این نام ویژگی LDAP روی کاربر است که برای نگاشت عضویت استفاده می شود. به طور معمول "uid" است. برای مثال، اگر مقدار «ویژگی LDAP کاربر عضویت» «uid» باشد و گروه LDAP «memberUid\: john» داشته باشد، انتظار می‌رود که کاربر خاص LDAP ویژگی «uid\: john» را داشته باشد.
