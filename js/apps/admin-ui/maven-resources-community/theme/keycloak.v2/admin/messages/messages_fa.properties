membershipTypeHelp=نوع عضویت برای کاربرانی که از طریق این ارائه دهنده هویت اضافه شده است. مدیریت شده یعنی کاربر نمی تواند خارج از این سازمان وجود داشته باشد. مدیریت نشده به این معنی است که کاربر می تواند به طور مستقل وجود داشته باشد. وقتی عضویت خودکار غیرفعال است یا سازمان دیگری قبلاً برای این ارائه‌دهنده هویت ادعای عضویت مدیریت شده را دارد، این قسمت غیرفعال می‌شود.
