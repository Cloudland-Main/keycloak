name: Deploy Keycloak Service to Production

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-keycloak-app
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Keycloak Service & Compose
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ vars.SERVER_HOST || secrets.SERVER_HOST || '45.92.93.96' }}
          SERVER_USER: ${{ vars.SERVER_USER || secrets.SERVER_USER || 'root' }}
          SERVER_PORT: ${{ vars.SERVER_PORT || secrets.SERVER_PORT || '22' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Secret SSH_PRIVATE_KEY is not defined. Please add it in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          mkdir -p ~/.ssh
          python3 -c "
          import os, sys

          raw = os.environ.get('SSH_PRIVATE_KEY', '').strip()
          if (raw.startswith('\"') and raw.endswith('\"')) or (raw.startswith(\"'\") and raw.endswith(\"'\")):
              raw = raw[1:-1].strip()

          raw = raw.replace('\\r\\n', '\n').replace('\\n', '\n').replace('\r', '')

          if '-----BEGIN OPENSSH PRIVATE KEY-----' in raw and '\n' not in raw:
              raw = raw.replace('-----BEGIN OPENSSH PRIVATE KEY-----', '-----BEGIN OPENSSH PRIVATE KEY-----\n')
              raw = raw.replace('-----END OPENSSH PRIVATE KEY-----', '\n-----END OPENSSH PRIVATE KEY-----\n')

          if not raw.endswith('\n'):
              raw += '\n'

          key_path = os.path.expanduser('~/.ssh/id_deploy')
          with open(key_path, 'w') as f:
              f.write(raw)
          os.chmod(key_path, 0o600)
          "

          echo "Key lines: $(wc -l < ~/.ssh/id_deploy), bytes: $(wc -c < ~/.ssh/id_deploy)"

          # Verify key format with OpenSSH
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::Invalid SSH private key format. Please ensure SSH_PRIVATE_KEY contains a valid OpenSSH private key."
            exit 1
          fi
          echo "SSH private key verified successfully."

          cat >> ~/.ssh/config <<EOF
          Host production
              HostName $SERVER_HOST
              User $SERVER_USER
              Port $SERVER_PORT
              IdentityFile ~/.ssh/id_deploy
              IdentitiesOnly yes
              StrictHostKeyChecking no
              KexAlgorithms ecdh-sha2-nistp256,curve25519-sha256,diffie-hellman-group14-sha256
              ServerAliveInterval 30
              ServerAliveCountMax 5
          EOF

      - name: Deploy Service Configurations & Restart
        run: |
          echo "==> Deploying updates to /opt/apps/keycloak..."
          ssh production "bash -e -s" << 'EOF'
            cd /opt/apps/keycloak

            # Sync docker compose if present
            docker compose up -d

            echo "==> Waiting for Keycloak to finish startup..."
            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8088/ || true)
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
                echo "Keycloak is up and responding (HTTP $HTTP_CODE)."
                break
              fi
              echo "Waiting for Keycloak readiness... attempt $i (HTTP $HTTP_CODE)"
              sleep 3
            done

            echo "==> Reloading Nginx..."
            nginx -t && systemctl reload nginx
          EOF

      - name: Verify Public Endpoints
        run: |
          echo "==> Verifying public HTTPS admin endpoint..."
          STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" https://iam-cloudland.ailand.ai/admin/)
          echo "Public Admin status: $STATUS"
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 302 ]; then
            echo "::error::Public admin endpoint returned HTTP $STATUS"
            exit 1
          fi
          echo "==> Keycloak service verified successfully!"
